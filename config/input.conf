# ============================================================
# MediaInspector_Pro - keybindings
# ============================================================

# --- Navigation (walks every supported media file in the folder) ---
LEFT         script-binding prev_media
RIGHT        script-binding next_media
Shift+LEFT   frame-back-step
Shift+RIGHT  frame-step
<            script-binding prev_media
>            script-binding next_media
PGDWN        script-binding next_media
PGUP         script-binding prev_media

# --- Play/pause is the space bar (and the bar's Play button) only. Clicking
#     a photo pans it, clicking video toggles playback - see
#     mediainspector.lua - so the two must not overlap. ---
SPACE        cycle pause

# --- Custom actions (scripts/mediainspector.lua) ---
s        script-binding slowmo_toggle
e        script-binding export_frame
i        script-binding show_info
u        script-binding upscale_cycle
w        script-binding fit_window
z        script-binding zoom_fit
x        script-binding zoom_actual
r        script-binding rotate_cw
R        script-binding rotate_ccw
Ctrl+a   script-binding audio_menu
Ctrl+h   script-binding hdr_toggle
h        script-binding toggle_help
F1       script-binding toggle_help

# --- Double-click fullscreen toggle disabled; left as a plain click ---
MBTN_LEFT_DBL ignore

# --- UI scale. Every variant of the +/- keys is bound because which name
#     mpv reports depends on shift state, keyboard layout and numpad vs
#     main row - and mpv's own defaults put audio-delay on Ctrl++/Ctrl+-,
#     so any unbound variant silently changes A/V sync instead of the UI. ---
Ctrl+=        script-binding ui_scale_up
Ctrl++        script-binding ui_scale_up
Ctrl+Shift+=  script-binding ui_scale_up
Ctrl+KP_ADD   script-binding ui_scale_up
Ctrl+-        script-binding ui_scale_down
Ctrl+_        script-binding ui_scale_down
Ctrl+KP_SUBTRACT script-binding ui_scale_down
Ctrl+0        script-binding ui_scale_reset
Ctrl+KP0      script-binding ui_scale_reset

# --- Mouse. The wheel means different things per media kind, which is why
#     it goes through the script rather than straight to a property: on
#     video and audio it is the shuttle (speed and direction), on a photo
#     there is no timeline to shuttle so it zooms. Side-scroll always steps
#     one frame - backward is the slow side, since mpv can only decode
#     forward and has to seek back to a keyframe and redecode. Hold Ctrl to
#     zoom regardless of kind. ---
WHEEL_UP     script-binding wheel_up
WHEEL_DOWN   script-binding wheel_down
WHEEL_RIGHT  frame-step
WHEEL_LEFT   frame-back-step
MBTN_MID     cycle pause
MBTN_BACK    frame-back-step
MBTN_FORWARD frame-step
Ctrl+WHEEL_UP    script-binding zoom_in
Ctrl+WHEEL_DOWN  script-binding zoom_out

# --- mpv defaults kept: 9/0 volume, m mute, a audio track, [ ] speed,
#     BS reset speed, SPACE pause, f fullscreen ---
