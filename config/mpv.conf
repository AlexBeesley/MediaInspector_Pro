# ============================================================
# MediaInspector_Pro - mpv configuration
# ============================================================

idle=yes
force-window=yes
keep-open=yes
save-position-on-quit=no
title=MediaInspector_Pro - ${filename}

# --- Media types ---
# A still image would otherwise be shown for one second and then treated as
# ended. inf makes it behave like a photo viewer: it stays until you move on.
image-display-duration=inf
# Audio-only files still get a window (force-window above); embedded cover
# art is shown as the video track when there is one.
audio-display=embedded-first

# --- Window sizing ---
# The Lua script sizes the window itself on every file load, so the picture
# lands at native size with the control bar *added* underneath rather than
# carved out of it - see fit_window() in config/scripts/mediainspector.lua.
# mpv's own auto-resize is off so the two don't fight; autofit-larger is
# still set as the backstop for the very first frame, before Lua has run.
auto-window-resize=no
# The window is free-form: drag any edge to whatever shape you want. mpv's
# aspect lock is off because it fights this player's layout twice over - it
# would snap a dragged window back to the *video's* ratio, while the window
# here is deliberately taller than the video by the height of the control
# bar. keepaspect (below, on by default) still applies to the picture, so a
# window wider or taller than the source letterboxes instead of stretching,
# and the bar keeps its band - it is carved out with video-margin-ratio and
# positioned from osd-dimensions, both of which follow the window.
keepaspect-window=no
autofit-larger=94%x90%
autofit-smaller=480x320

# --- GPU pipeline (libplacebo / D3D11) ---
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
# 10-bit swapchain so HDR10/PQ and 10-bit SDR survive the output path.
# HDR itself is off by default - see target-colorspace-hint below.
d3d11-output-format=rgb10_a2
# auto-safe tries d3d11va first (frames stay in VRAM - no per-frame readback
# to system RAM), then the -copy variants, then software. Verified engaging
# as "d3d11va / d3d11[nv12]" on 4:2:0 footage. Note 4:4:4 sources always
# fall back to CPU - no GPU has a 4:4:4 H.264 decoder. RTX Video Super
# Resolution (the panel's RTX mode) needs the non-copy d3d11va path, so it
# is unavailable whenever this falls back.
#
# This line is the ONLY thing that sets hwdec, and it is deliberately not
# exposed anywhere: there is no button in ControlPanel.ps1 and no binding in
# input.conf (mpv's built-in Ctrl+h hwdec toggle is shadowed there by
# hdr_toggle). Hardware decoding is always on. The only other writer is
# apply_upscale() in scripts/mediainspector.lua, which swaps between
# auto-safe and d3d11va for RTX - both hardware paths. Do not add a toggle.
hwdec=auto-safe
hwdec-codecs=all
# Decoded-surface pool held in VRAM. A massive pool (256 frames) is required
# to hold an entire keyframe interval so hardware decoding can run backward
# without wedging. At 4K this uses roughly 3GB of VRAM.
hwdec-extra-frames=256
# Decoded frames queued ahead, also VRAM-resident with hwdec above.
vd-queue-enable=yes
vd-queue-max-samples=96
vd-queue-max-bytes=1536MiB

# --- Quality: the expensive scalers/shaders, since the GPU has headroom ---
scale=ewa_lanczos4sharpest
cscale=ewa_lanczos4sharpest
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
dither-depth=auto
temporal-dither=yes
deband=yes
deband-iterations=4
deband-grain=24

# --- HDR / wide-gamut ---
# Off by default: the swapchain stays SDR (HDR sources are tone-mapped down)
# until you opt in with Ctrl+H, the bar's HDR button, or the control panel's
# HDR button - see hdr_toggle() in config/scripts/mediainspector.lua.
# Toggling on switches to "auto", which then only engages HDR for PQ/HLG
# sources; SDR sources stay SDR either way.
# hint-mode=target is static (one metadata blob per file). source-dynamic
# rewrote HDR metadata every scene and stuttered playback.
target-colorspace-hint=no
target-colorspace-hint-mode=target
hdr-compute-peak=yes
sub-hdr-peak=400

# --- Timing / seeking ---
video-sync=display-resample
interpolation=no
hr-seek=yes
hr-seek-framedrop=no
hr-seek-demuxer-offset=1

# --- Cache for large 4K/120fps files.
#     NOTE: this is system RAM, not VRAM - it's what stops scrubbing from
#     hitting the disk. The VRAM levers are the surface pool / queues above.
cache=yes
demuxer-max-bytes=3072MiB
demuxer-max-back-bytes=1536MiB
demuxer-readahead-secs=60

# --- Reverse playback (the shuttle bar runs through play-direction).
#     mpv can only decode forward, so playing backward means decoding a run
#     of frames ahead, holding them, and handing them back in reverse. That
#     buffer holds DECODED frames, so it fills fast at 4K - roughly 12MB per
#     frame, i.e. the 1GiB default is only ~80 frames, less than one keyframe
#     range of 60fps footage. Too small and reverse stalls and re-seeks
#     instead of running. demuxer-max-back-bytes above is the other half:
#     backward demuxing reads out of that cache.
#     Since hwdec-extra-frames is now massive, hwdec is left on backwards.
video-reversal-buffer=3072MiB
audio-reversal-buffer=128MiB

# --- Frame / image export: native resolution, lossless ---
screenshot-format=png
screenshot-png-compression=6
screenshot-jpeg-quality=97
screenshot-webp-lossless=yes
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes

# --- UI: custom control bar in scripts/mediainspector.lua replaces the
#     default OSC so exactly one thing handles left-click. ---
osc=no
osd-bar=no
osd-font-size=32
# mpv's built-in drag-video-to-move-window fires underneath custom buttons,
# and would fight the photo viewer's drag-to-pan.
window-dragging=no

# --- Defaults ---
mute=yes
loop-file=inf

# --- IPC socket used by ControlPanel.ps1 and Launch.ps1 ---
input-ipc-server=\\.\pipe\mediainspector_pro
