# ============================================================
# SlowmoPlayer - mpv configuration
# ============================================================

idle=yes
force-window=yes
keep-open=yes
save-position-on-quit=no
title=SlowmoPlayer - ${filename}

# --- GPU pipeline (libplacebo / D3D11) ---
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
# auto-safe tries d3d11va first (frames stay in VRAM - no per-frame readback
# to system RAM), then the -copy variants, then software. Verified engaging
# as "d3d11va / d3d11[nv12]" on 4:2:0 footage. Note 4:4:4 sources always
# fall back to CPU - no GPU has a 4:4:4 H.264 decoder.
hwdec=auto-safe
hwdec-codecs=all
# Decoded-surface pool held in VRAM. Default is 6; a big pool is what makes
# fast scrubbing and frame-stepping through 4K120 feel instant. At 4K this
# is roughly 12MB per surface, so 48 surfaces is about 600MB of an 8GB card.
hwdec-extra-frames=48
# Decoded frames queued ahead, also VRAM-resident with hwdec above.
vd-queue-enable=yes
vd-queue-max-samples=96
vd-queue-max-bytes=1536MiB

# --- Quality: the expensive scalers/shaders, since the GPU has headroom ---
scale=ewa_lanczos4sharpest
cscale=ewa_lanczos4sharpest
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
dither-depth=auto
temporal-dither=yes
deband=yes
deband-iterations=4
deband-grain=24
hdr-compute-peak=yes

# --- Timing / seeking ---
video-sync=display-resample
interpolation=no
hr-seek=yes
hr-seek-framedrop=no
hr-seek-demuxer-offset=1

# --- Cache for large 4K/120fps files.
#     NOTE: this is system RAM, not VRAM - it's what stops scrubbing from
#     hitting the disk. The VRAM levers are the surface pool / queues above.
cache=yes
demuxer-max-bytes=3072MiB
demuxer-max-back-bytes=1536MiB
demuxer-readahead-secs=60

# --- Frame export: native resolution, lossless ---
screenshot-format=png
screenshot-png-compression=6
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes

# --- UI: custom control bar in scripts/slowmo.lua replaces the default OSC
#     so exactly one thing handles left-click. ---
osc=no
osd-bar=no
osd-font-size=32
# mpv's built-in drag-video-to-move-window fires underneath custom buttons
window-dragging=no

# --- Defaults ---
mute=yes
loop-file=inf

# --- IPC socket used by ControlPanel.ps1 and Launch.ps1 ---
input-ipc-server=\\.\pipe\slowmoplayer
