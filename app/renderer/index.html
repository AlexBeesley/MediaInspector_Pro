<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MediaInspector_Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="head">
    <div id="kind">video</div>
    <div id="titlewrap">
      <div id="title">Starting player…</div>
      <div id="specs"></div>
    </div>
    <div id="headbtns"></div>
    <div id="accent"></div>
  </header>

  <main id="body">
    <aside id="panel"><div id="cards"></div></aside>
    <div id="splitter" title="Drag to resize. Double-click to fit the panel to the media."></div>
    <section id="stage">
      <div id="hint">The picture is drawn here by the player.</div>
    </section>
  </main>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
